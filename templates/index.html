<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Distance Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🚶 Walking Distance Tracker</h1>
            <p class="date" id="selectedDate"></p>
        </header>

        <!-- Day Selector -->
        <div class="day-selector-section">
            <div class="day-selector" id="daySelector">
                <!-- Days will be populated by JavaScript -->
            </div>
        </div>

        <!-- Location Search Input -->
        <div class="search-section">
            <div class="search-container">
                <input
                    type="text"
                    id="locationInput"
                    placeholder="Search for a location..."
                    autocomplete="off"
                />
                <button id="searchButton" class="search-button">Search</button>
                <div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
            </div>
        </div>

        <!-- Stats Summary -->
        <div class="stats-summary" id="statsSummary">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Today</div>
                    <div class="stat-value">
                        <span class="stat-number" id="statToday">--</span>
                        <span class="stat-unit">mi</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">This Week</div>
                    <div class="stat-value">
                        <span class="stat-number" id="statThisWeek">--</span>
                        <span class="stat-unit">mi</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Last Week</div>
                    <div class="stat-value">
                        <span class="stat-number" id="statLastWeek">--</span>
                        <span class="stat-unit">mi</span>
                    </div>
                </div>
            </div>
            <a href="/stats" class="stats-link">See more stats</a>
        </div>

        <!-- Day Note -->
        <div class="note-section">
            <textarea
                id="dayNote"
                class="day-note-input"
                placeholder="Add a note for today (e.g., went climbing, physical therapy, etc.)"
                maxlength="200"
                rows="2"
            ></textarea>
        </div>

        <!-- Map Preview -->
        <div class="map-section">
            <h2>Route Map</h2>
            <div id="map" class="map-container"></div>
        </div>

        <!-- Location List -->
        <div class="locations-section">
            <h2>Locations</h2>
            <div id="locationsList" class="locations-list empty">
                <p class="empty-message">No locations added yet. Start by searching for a location above.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
